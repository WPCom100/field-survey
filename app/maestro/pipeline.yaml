# Pipeline project (T154, rig plan §2): the checklist's "pipeline test" — a project B2–06M (PROJECT,
# "Maestro pipeline" from `rig.sh pipeline`) with BOM.pdf and riser.pdf extracted on the server and
# the 06M display sheet, synced. `rig.sh pipeline` stages exactly these three in "On My iPad", in
# name order: BOM.pdf, Level_06M_-_Lighting_Composite_vector.pdf, riser.pdf. The rig has no Claude
# key: the riser's far ends come back unresolved ("n far ends to pick"), which the endpoint-picker
# flows need anyway. Needs the worker (rig.sh server starts it).
appId: productions.luminarytechnology.fieldsurvey
name: Pipeline — BOM, riser and the 06M sheet into Maestro pipeline
---
- runFlow: _launch.yaml
- runFlow: _connect.yaml
- tapOn:
    id: nav.projects
- tapOn:
    id: projects.new
- assertVisible: New project
- tapOn:
    id: newProject.name
- inputText: ${PROJECT}
# B2, B1, 01–04, 06, 06M: one level at a time (Add range makes out-of-scope levels), each added
# with Return: the "+ Add level" button slides under the keyboard as the table grows (T154). The
# field keeps focus after Return, so it is tapped once: re-tapped, it sits under the keyboard by the
# fifth level and the tap types a key into it ("403", "E04", T158)
- tapOn:
    id: newProject.levelCode
- inputText: B2
- pressKey: Enter
- inputText: B1
- pressKey: Enter
- inputText: '01'
- pressKey: Enter
- inputText: '02'
- pressKey: Enter
- inputText: '03'
- pressKey: Enter
- inputText: '04'
- pressKey: Enter
- inputText: '06'
- pressKey: Enter
- inputText: 06M
- pressKey: Enter
- waitForAnimationToEnd:         # the form scrolls itself to the bottom after each Return: a tap
    timeout: 5000                #   meanwhile landed on 01's numbering picker (T158)
- tapOn: Levels                 # closes the keyboard over Create
- assertNotVisible: own group    # no numbering picker open (its list's first chip)
- scrollUntilVisible:
    element:
      id: newProject.create
    direction: DOWN
- tapOn:
    id: newProject.create
- extendedWaitUntil:
    visible:
      id: level.06M
    timeout: 120000   # Create waits behind the first pull of every server project
- assertVisible:
    id: level.B2
- tapOn:
    id: nav.setup
- tapOn:
    id: setup.step.sources
# the BOM first, then the riser (the riser merges its devices into the BOM's drafts)
- tapOn:
    id: sources.bom
- runFlow: _pick-wait.yaml
- tapOn:
    point: ${PICK_SIDE}          # sidebar: On My iPad
- runFlow: _pick-wait.yaml
- tapOn:
    point: ${PICK_1}          # 1st file: BOM.pdf
- extendedWaitUntil:
    visible:
      id: sources.bom.status
      text: 'Done: \d+ device drafts, \d+ excluded lines, \d+ flagged'
    timeout: 600000
- tapOn:
    id: sources.riser
- runFlow: _pick-wait.yaml
- tapOn:
    point: ${PICK_SIDE}          # On My iPad
- runFlow: _pick-wait.yaml
- tapOn:
    point: ${PICK_3}          # 3rd file: riser.pdf
- extendedWaitUntil:
    visible:
      id: sources.riser.status
      text: 'Done: \d+ device drafts \(\d+ merged into the BOM.s\), \d+ cable drafts, [1-9]\d* far ends to pick'
    timeout: 600000
# the 06M display sheet (single selection opens on tap)
- scrollUntilVisible:
    element:
      id: plans.display.06M
    direction: DOWN
- tapOn:
    id: plans.display.06M
- runFlow: _pick-wait.yaml
- tapOn:
    point: ${PICK_SIDE}          # On My iPad
- runFlow: _pick-wait.yaml
- tapOn:
    point: ${PICK_2}          # 2nd file: the 06M composite PDF
- extendedWaitUntil:
    visible:
      id: plans.open.06M     # shown once the sheet job is done and the sheet synced
    timeout: 180000
- runFlow: _logbox.yaml
- tapOn:
    id: setup.home
- runFlow: _sync.yaml
