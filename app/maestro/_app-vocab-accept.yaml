# One app-library vocabulary draft accepted on Vocabulary (App library scope, Lists tab): V is the
# value. Optional throughout: a value already accepted on this server has no Accept link. The link
# goes once the accept lands; a tap made while the list reloaded after the previous accept can
# miss (T198: Equipment stayed a draft), so a link still there is tapped again.
appId: productions.luminarytechnology.fieldsurvey
---
- scrollUntilVisible:
    element:
      id: vocab.accept.${V}
    direction: DOWN
    centerElement: true
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: vocab.accept.${V}
    optional: true
- extendedWaitUntil:
    notVisible:
      id: vocab.accept.${V}
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: vocab.accept.${V}
    commands:
      - tapOn:
          id: vocab.accept.${V}
      - extendedWaitUntil:
          notVisible:
            id: vocab.accept.${V}
          timeout: 5000
