# Setup → 3 Sources: the DaVinci library (library.json + DaVinci_categories.xlsx, `_davinci.yaml`)
# and the 06M display sheet, both from the Files app (T151). `rig.sh files` stages exactly these
# three in "On My iPad", so the picker shows them in this order (by name): DaVinci_categories.xlsx,
# davinci-library-sample.json, Level_06M_-_Lighting_Composite_vector.pdf. The picker is another
# process: Maestro sees none of it, so it is tapped by position (iPad Pro 13" simulator, portrait).
# Needs the worker (rig.sh server starts it): both uploads are server jobs. No Claude API.
appId: productions.luminarytechnology.fieldsurvey
---
- runFlow: _davinci.yaml
# Floor plans: the 06M display sheet (single selection opens on tap)
- runFlow:
    file: _sheet.yaml
    env:
      AT: 65%,35%           # 3rd file: the 06M composite PDF
