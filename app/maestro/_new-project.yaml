# Projects → + New project → name, one level (06M) → Create → the home opens on it → open the
# level (no sheet yet) → back. The name is PROJECT (rig.sh: "Maestro <date time>"), so every run
# makes its own project and a second simulator can open the same one (T151).
appId: productions.luminarytechnology.fieldsurvey
---
- tapOn:
    id: nav.projects
- assertVisible: Projects
- tapOn:
    id: projects.new
- assertVisible: New project
- evalScript: ${output.project = PROJECT}
- tapOn:
    id: newProject.name
- inputText: ${output.project}
- tapOn:
    id: newProject.levelCode
- inputText: 06M
# iOS's "Save Password?" sheet for the token can come up late, after the name picker (B, T158):
# Maestro sees neither it nor the app behind it, so a hidden button means the sheet is up —
# its "Not Now" is tapped by position, as `_connect` does
- runFlow:
    when:
      notVisible:
        id: newProject.addLevel
    commands:
      - tapOn:
          point: 43%,57%
- tapOn:
    id: newProject.addLevel
- assertVisible: 06M
- tapOn:
    id: newProject.create
- extendedWaitUntil:
    visible: ${output.project}
    timeout: 20000
- extendedWaitUntil:              # Create waits behind the first pull of every server project (T154)
    visible:
      id: level.06M
    timeout: 120000
- tapOn:
    id: level.06M
- extendedWaitUntil:
    visible: No plan sheet yet.*
    timeout: 15000
- tapOn:
    id: plan.back
- assertVisible: ${output.project}
