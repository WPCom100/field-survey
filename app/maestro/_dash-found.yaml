# R3 step 2 (T157): the as-found drill-downs (T147), counts that follow a typed address (01-06's IP,
# 01-01's DMX), the Levels filter on them, readiness setup → ready → surveying (T38), and search
# by ID, note phrase, #n, c-nn, dmx, an IP (whole and partial) and a DMX address that changes
# (T148). Starts and ends on Levels.
appId: productions.luminarytechnology.fieldsurvey
---
- tapOn:
    id: nav.dashboard
- extendedWaitUntil:
    visible:
      id: dash.cell.devices.total.total
    timeout: 30000
- scrollUntilVisible:
    element:
      id: dash.found.dmxMissing
    direction: DOWN
- runFlow:
    file: _dash-asfound.yaml
    env:
      KEY: ipMissing
- assertVisible:
    id: dash.panel.title
    text: Devices without an IP address \(9\)
- assertVisible: '.*01-06.*'
- runFlow:
    file: _dash-asfound.yaml
    env:
      KEY: dmxMissing
- assertVisible:
    id: dash.panel.title
    text: Devices without a DMX address \(16\)
- runFlow:
    file: _dash-asfound.yaml
    env:
      KEY: neuronMissing
- assertVisible:
    id: dash.panel.title
    text: 'Devices without a Neuron ID \(\d+\)'
- runFlow:
    file: _dash-asfound.yaml
    env:
      KEY: fieldAdditions
- assertVisible:
    id: dash.panel.title
    text: Field additions \(0\)
- assertVisible: Nothing here.
- tapOn:
    id: dash.close
- tapOn: ← Levels

# an IP on 01-06 and a DMX address on 01-01 (card → Type…)
- runFlow:
    file: _open-card.yaml
    env:
      LEVEL: '01'
      DEVICE: 01-06
- runFlow:
    file: _card-address.yaml
    env:
      KIND: ip
      VALUE: 10.101.4.23
- assertVisible: 10.101.4.23
- tapOn:
    id: card.close
- tapOn:
    id: plan.device.01-01
- runFlow:
    file: _card-address.yaml
    env:
      KIND: dmx
      VALUE: 1/001
- assertVisible: '1/0*1'
- tapOn:
    id: card.close
- tapOn:
    id: plan.back

# the counts follow; the device leaves its list; Level 01 alone
- tapOn:
    id: nav.dashboard
- scrollUntilVisible:
    element:
      id: dash.found.dmxMissing
    direction: DOWN
- assertVisible: { id: dash.found.ipMissing, text: IP addresses captured 1/9 }
- assertVisible: { id: dash.found.dmxMissing, text: DMX addresses captured 1/16 }
- runFlow:
    file: _dash-asfound.yaml
    env:
      KEY: ipMissing
- assertVisible:
    id: dash.panel.title
    text: Devices without an IP address \(8\)
- assertNotVisible: '.*01-06.*'
- tapOn:
    id: dash.level.01
- assertVisible:
    id: dash.panel.title
    text: Devices without an IP address \(1\)
- tapOn:
    id: dash.close
- scrollUntilVisible:
    element:
      id: dash.found.dmxMissing
    direction: DOWN
- assertVisible: { id: dash.found.ipMissing, text: 'IP addresses captured 1/2' }
- assertVisible: { id: dash.found.dmxMissing, text: 'DMX addresses captured 1/3' }
- tapOn:
    id: dash.level.all

# readiness: B2 setup → ready once locked → surveying after an edit on it
- scrollUntilVisible:
    element:
      id: dash.ready.B2
    direction: DOWN
- assertVisible:
    id: dash.ready.B2
    text: 'B2 setup.*'
- tapOn: ← Levels
- tapOn:
    id: nav.setup
- tapOn:
    id: setup.step.lock
- tapOn: 'Lock B2( ⚠)?'
- tapOn: 'Lock anyway|Lock B2'
- extendedWaitUntil:
    visible: '🔒 Locked.*'
    timeout: 10000
- tapOn:
    id: setup.home
- tapOn:
    id: nav.dashboard
- scrollUntilVisible:
    element:
      id: dash.ready.B2
    direction: DOWN
- assertVisible:
    id: dash.ready.B2
    text: 'B2 ready.*'
- tapOn: ← Levels
- runFlow:
    file: _open-card.yaml
    env:
      LEVEL: B2
      DEVICE: B2-S1
- tapOn:
    id: card.status.No access
- assertVisible: ✓ No access
- tapOn:
    id: card.close
- tapOn:
    id: plan.back
- tapOn:
    id: nav.dashboard
- scrollUntilVisible:
    element:
      id: dash.ready.B2
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: dash.ready.B2
      text: 'B2 surveying.*'
    timeout: 10000

# search: an ID → its card; a note phrase; #n; c-nn; dmx; an IP whole and partial; a DMX address
- runFlow:
    file: _dash-search.yaml
    env:
      TERM: 06M-04
- assertVisible: 'Search “06M-04” \(\d+\)'
- assertVisible: 'Devices \d+'
- tapOn:
    id: dash.search.row
    index: 0
- extendedWaitUntil:
    visible:
      id: card.close
    timeout: 15000
- assertVisible: '06M-04.*'
- tapOn:
    id: plan.back
- runFlow:
    file: _dash-search.yaml
    env:
      TERM: Empty box
- assertVisible: 'Search “Empty box” \([1-9]\d*\)'
- runFlow:
    file: _dash-search.yaml
    env:
      TERM: '#12'
- assertVisible: 'Search “#12” \([1-9]\d*\)'
- assertVisible: 'Punch \d+'
- runFlow:
    file: _dash-search.yaml
    env:
      TERM: c-14
- assertVisible: 'Search “c-14” \([1-9]\d*\)'
- assertVisible: 'Connections \d+'
- runFlow:
    file: _dash-search.yaml
    env:
      TERM: dmx
- assertVisible: 'Search “dmx” \([1-9]\d*\)'
- runFlow:
    file: _dash-search.yaml
    env:
      TERM: 10.101.4.23
- assertVisible: 'Search “10.101.4.23” \(1\)'
- assertVisible:
    id: dash.search.row
    text: '.*01-06.*'
- runFlow:
    file: _dash-search.yaml
    env:
      TERM: '10.101'
- assertVisible:
    id: dash.search.row
    text: '.*01-06.*'
- runFlow:
    file: _dash-search.yaml
    env:
      TERM: 1/001
- assertVisible:
    id: dash.search.row
    text: '.*01-01.*'
- tapOn:
    id: dash.close
- assertNotVisible:
    id: dash.panel.title
- tapOn: ← Levels

# the DMX address changes: the new one is found, the old one no longer
- runFlow:
    file: _open-card.yaml
    env:
      LEVEL: '01'
      DEVICE: 01-01
- runFlow:
    file: _card-address.yaml
    env:
      KIND: dmx
      VALUE: 2/017
- assertVisible: 2/017
- tapOn:
    id: card.close
- tapOn:
    id: plan.back
- tapOn:
    id: nav.dashboard
- runFlow:
    file: _dash-search.yaml
    env:
      TERM: 2/017
- assertVisible:
    id: dash.search.row
    text: '.*01-01.*'
- runFlow:
    file: _dash-search.yaml
    env:
      TERM: 1/001
- extendedWaitUntil:
    visible: No matches.
    timeout: 10000
- tapOn:
    id: dash.close
- tapOn: ← Levels
