# Fresh launch. A local dev client (rig.sh build) opens on its launcher, so the Metro deep link
# loads the app; a --release build has the JS embedded and METRO_URL is set to '' by the caller.
appId: productions.luminarytechnology.fieldsurvey
---
- launchApp:
    clearState: true
- runFlow:
    when:
      true: ${METRO_URL != ''}
    commands:
      - openLink: fieldsurvey://expo-development-client/?url=${METRO_URL}
      # iOS asks before a link opens the app; the dev client then shows its menu (onboarding
      # on a cleared state, then the menu itself) over the app until it is closed (T151)
      - tapOn:
          text: Open
          optional: true
      - tapOn:
          text: Continue
          optional: true
      - runFlow:
          when:
            visible: Toggle element inspector
          commands:
            - tapOn:
                text: Close
                optional: true
      - runFlow:
          when:
            visible: Toggle element inspector
          commands:
            - tapOn:
                point: 92%,43%
- extendedWaitUntil:
    visible: Connect to server
    timeout: 90000
