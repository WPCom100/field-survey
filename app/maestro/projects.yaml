# R7 step 1 of `rig.sh projects` (T157, rig plan wave 4): two projects on one iPad (T83, T142).
# A new project PROJECT (06M only) beside "Maestro master" (the seed, B2 … 06): Refresh from server;
# Projects switches the project, and Lint, Cable / riser, Dashboard, Rulings and Export follow the
# chosen project; the new-project form names a two-way numbering share and a chain and Create
# refuses both; the bar's back (T190, D280): none on Projects from the project button or on Setup from
# the sidebar, ‹ Projects on New project (its Cancel returns there too), Rule defaults, the app library
# and Setup, ‹ Library on the app library's review; the rail's Levels from Setup.
appId: productions.luminarytechnology.fieldsurvey
name: R7 — Projects
---
- runFlow: _launch.yaml
- runFlow: _connect.yaml
- runFlow: _new-project.yaml

# Refresh from server: everything the server lists is (or comes) on this iPad
- tapOn:
    id: nav.projects
- tapOn:
    id: projects.refresh
- extendedWaitUntil:
    visible: '(Server lists \d+ projects?; all are on this iPad\.|\d+ projects? not yet on this iPad: downloading now\.)'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: projects.open.Maestro master
    direction: DOWN
    timeout: 120000
- assertNotVisible:
    id: projects.back           # from the project button: a section, no back (T190)
- tapOn:
    id: rail.levels

# Projects switches the project (the home's chips went with T176); every sidebar screen follows
- runFlow:
    file: _projects-follow.yaml
    env:
      CHIP: Maestro master
      HAS: B2
      HASNOT: none
- runFlow:
    file: _projects-follow.yaml
    env:
      CHIP: ${PROJECT}
      HAS: 06M
      HASNOT: B2

# the new-project form: a two-way share and a chain are named, and Create refuses them
- tapOn:
    id: nav.projects
- tapOn:
    id: projects.new
- tapOn:
    id: newProject.name
- inputText: ${PROJECT} refused
- pressKey: Enter          # closes the Name keyboard: since T180's cards the Add level field sits under it
- waitForAnimationToEnd
- runFlow:
    file: _projects-level.yaml
    env:
      CODE: '06'
- runFlow:
    file: _projects-level.yaml
    env:
      CODE: 06M
# 06M arrives sharing 06 (and a split of it) by default (T172); 06 → 06M makes the two-way share
- tapOn:
    id: newProject.share.06
- tapOn:
    id: newProject.share.06.06M
- tapOn:
    id: newProject.share.06M
# wait for the option: run 4 (2026-11-09) sent the next tap while the picker was still opening (T180)
- extendedWaitUntil:
    visible:
      id: newProject.share.06M.06
    timeout: 5000
- tapOn:
    id: newProject.share.06M.06
- assertVisible: 'Levels 06 and 06M share numbering with each other\. .*'
- tapOn:
    id: newProject.create
- assertVisible: 'Levels 06 and 06M share numbering with each other\. .*'
- scrollUntilVisible:          # since T190 the bar puts Create under the bottom edge here
    element:
      id: newProject.create
      text: Create project
    direction: DOWN
# a chain: 06M → 06 → 07
- runFlow:
    file: _projects-level.yaml
    env:
      CODE: '07'
- tapOn:
    id: newProject.share.06
- tapOn:
    id: newProject.share.06.07
- assertVisible: 'Level 06M shares with 06, which itself shares with 07\. .*'
- tapOn:
    id: newProject.create
- assertVisible: 'Level 06M shares with 06, which itself shares with 07\. .*'
- assertVisible:
    id: newProject.back
    text: Projects
- tapOn:
    id: newProject.back
- assertVisible: '\+ New project'
- assertNotVisible:
    id: projects.open.${PROJECT} refused
# New project's Cancel returns to Projects too
- tapOn:
    id: projects.new
- tapOn:
    id: newProject.cancel
- assertVisible:
    id: projects.new
- assertNotVisible:
    id: projects.back

# Rule defaults and the app library (and its review, when it has one) name where they return
- tapOn:
    id: projects.ruleDefaults
- assertVisible:
    id: ruleDefaults.back
    text: Projects
- tapOn:
    id: ruleDefaults.back
- tapOn:
    id: projects.library
- assertVisible:
    id: library.back
    text: Projects
- runFlow:
    when:
      visible:
        id: library.review
    commands:
      - tapOn:
          id: library.review
      - assertVisible:
          id: review.back
          text: Library
      - tapOn:
          id: review.back
- tapOn:
    id: library.back
- assertVisible:
    id: projects.new

# Setup from Projects: ‹ Projects; the rail's Levels leads home (Setup's own link before T190)
- tapOn:
    text: Setup ▸
    index: 0
- assertVisible:
    id: setup.back
    text: Projects
- tapOn:
    id: setup.back
- assertVisible:
    id: projects.new
- tapOn:
    text: Setup ▸
    index: 0
- tapOn:
    id: rail.levels
- extendedWaitUntil:
    visible:
      id: nav.needs-review
    timeout: 10000
# Setup from the sidebar: a section, no back
- tapOn:
    id: nav.setup
- assertVisible:
    id: setup.step.levels
- assertNotVisible:
    id: setup.back
- tapOn:
    id: rail.levels
- extendedWaitUntil:
    visible:
      id: nav.needs-review
    timeout: 10000
