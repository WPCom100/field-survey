# F1 step 1 (T155): on 06M-01's card (open), the X run C-23 to the placeholder "Level 11" (Not
# started in the master, no item) → This end Not installed → back on the card the R3a Run draft →
# Accept (Punch items +1) → the R4b kit draft for that end → Accept (Parts +1). A section header
# reads as its title and count (`Punch items 3 · 1 draft`, `Parts 2`; T175).
appId: productions.luminarytechnology.fieldsurvey
---
- runFlow:
    file: _side-down.yaml
    env:
      ID: card.section.punch
- copyTextFrom:
    id: card.section.punch
- evalScript: ${output.punch = parseInt(maestro.copiedText.match(/Punch items (\d+)/)[1])}
- runFlow:
    file: _side-down.yaml
    env:
      ID: card.section.parts
- copyTextFrom:
    id: card.section.parts
- evalScript: ${output.parts = parseInt(maestro.copiedText.match(/Parts (\d+)/)[1])}
- runFlow:
    file: _side-up.yaml
    env:
      ID: card.conn.C-23
- runFlow:
    file: _open-end.yaml
    env:
      CONN: C-23
- assertVisible: 'This end: 06M-01 .*'
- assertVisible: 'Other end: Level 11'
- tapOn:
    id: end.this.status.Not installed
- assertVisible: ✓ Not installed
- tapOn:
    id: end.back
- runFlow:
    file: _side-down.yaml
    env:
      ID: proposal.accept.Run DMX to Level 11
- tapOn:
    id: proposal.accept.Run DMX to Level 11
- assertNotVisible:
    id: proposal.accept.Run DMX to Level 11
- runFlow:
    file: _side-up.yaml
    env:
      ID: card.section.punch
- assertVisible:
    id: card.section.punch
    text: 'Punch items ${output.punch + 1}( · .*)?'
- runFlow:
    file: _side-down.yaml
    env:
      ID: proposal.accept.DMX termination kit - Level 11 run
- tapOn:
    id: proposal.accept.DMX termination kit - Level 11 run
- runFlow:
    file: _side-down.yaml
    env:
      ID: card.section.parts
- assertVisible:
    id: card.section.parts
    text: 'Parts ${output.parts + 1}'
