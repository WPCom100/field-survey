# Smoke flow (T149, D248): connect to the local e2e server, create a project with one level,
# open that level, sync. `bash scripts/mac/rig.sh flows` runs it and passes SERVER_URL, TOKEN,
# METRO_URL and USER with -e. No `env:` block: a flow's own env beats -e (T151: RIG_USER=Bob still
# ran as Ann). Sub-flows start with `_` and are not run on their own.
appId: productions.luminarytechnology.fieldsurvey
name: Smoke — connect, create a project, open its level, sync
---
- runFlow: _launch.yaml
- runFlow: _connect.yaml
- runFlow: _new-project.yaml
- runFlow: _sync.yaml
