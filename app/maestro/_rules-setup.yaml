# S3 (T158) rules step 0: on a fresh seed copy, two rule-accepted Run items with different far
# ends (06M-01's C-23 "Run DMX to Level 11" with its kit, `_ends-run`; 06M-02's C-12 "Run DMX to
# equipment rack") and an open Run draft on 06M-04 (C-13, Issue in the master, set Not installed).
# Starts and ends on Levels.
appId: productions.luminarytechnology.fieldsurvey
---
- runFlow:
    file: _open-card.yaml
    env:
      LEVEL: 06M
      DEVICE: 06M-01
- runFlow: _ends-run.yaml
- tapOn:
    id: card.close
- tapOn:
    id: plan.tab.devices
- tapOn:
    id: plan.device.06M-02
- runFlow:
    file: _side-down.yaml
    env:
      ID: proposal.accept.Run DMX to equipment rack
- tapOn:
    id: proposal.accept.Run DMX to equipment rack
# T185: wait for the card's reload (a second or more while the store syncs) before looking: the
# item takes the draft's place, often just below the fold, so look down a little before looking up
# (as _ends-wire); looking up at once scrolled it out of reach
- extendedWaitUntil:
    notVisible:
      id: proposal.accept.Run DMX to equipment rack
    timeout: 15000
- repeat:
    times: 3
    while:
      notVisible:
        id: card.punch.Run DMX to equipment rack
    commands:
      - swipe:
          start: 86%,75%
          end: 86%,47%
          duration: 500
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    file: _side-up.yaml
    env:
      ID: card.punch.Run DMX to equipment rack
- tapOn:
    id: card.close
- tapOn:
    id: plan.tab.devices
- tapOn:
    id: plan.device.06M-04
- runFlow:
    file: _side-up.yaml
    env:
      ID: card.conn.C-13
- runFlow:
    file: _open-end.yaml
    env:
      CONN: C-13
- tapOn:
    id: end.this.status.Not installed
- assertVisible: ✓ Not installed
- tapOn:
    id: end.back
- runFlow:
    file: _side-down.yaml
    env:
      ID: 'proposal\.reject\.Run DMX to .*CT04LCPA'
- tapOn:
    id: card.close
- tapOn:
    id: plan.back
