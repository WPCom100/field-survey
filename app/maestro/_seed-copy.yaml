# A fresh copy of the master workbook in PROJECT (T155): + New project (06M) → Setup → 3 Sources →
# Seed import (the workbook `rig.sh flows` stages alone in "On My iPad") → Import → "Imported" →
# sync → Vocabulary → Load standard lists. The wave-1 flows edit, accept drafts and add records, so
# each run works on its own copy: a second run on "Maestro master" would find the first run's
# items already there. The mapping detours and the review items are seed.yaml's (S1), not here.
appId: productions.luminarytechnology.fieldsurvey
---
- runFlow: _new-project.yaml
- tapOn:
    id: nav.setup
- tapOn:
    id: setup.step.sources
- scrollUntilVisible:
    element:
      id: seed.choose
    direction: DOWN
- tapOn:
    id: seed.kind.master_xlsx
- tapOn:
    id: seed.choose
- runFlow: _pick-wait.yaml
- tapOn:
    point: 14%,46%          # sidebar: On My iPad
- runFlow: _pick-wait.yaml
- tapOn:
    point: "${typeof SEED_AT === 'undefined' ? '41%,35%' : SEED_AT}"   # the workbook: the one file, else SEED_AT (place.yaml)
- extendedWaitUntil:
    visible:
      id: seed.matched
    timeout: 60000
- assertVisible: 'Devices: 210 rows'
- scrollUntilVisible:
    element:
      id: seed.import
    direction: DOWN
    centerElement: true     # mid-screen, clear of the T161 toast along the bottom edge (T156)
- runFlow: _logbox.yaml     # T161's toast took this tap once and opened the dev log instead
- tapOn:
    id: seed.import
# ...and once more since (T156): the log opened over the screen, so close it and tap again
- runFlow:
    when:
      visible: Console Error
    commands:
      - runFlow: _logbox-open.yaml
      - tapOn:
          id: seed.import
- scrollUntilVisible:
    element:
      id: seed.status
    direction: DOWN
    timeout: 120000   # behind another upload job on the worker
- extendedWaitUntil:
    visible:
      id: seed.status
      text: Imported
    timeout: 300000
- runFlow: _logbox.yaml
- tapOn:
    id: setup.home
- runFlow: _sync.yaml
- tapOn:
    id: nav.vocabulary
- tapOn:
    id: vocab.loadStandard
- extendedWaitUntil:
    visible:
      id: vocab.note
      text: 'Added .* values? and .* placeholders?\.'
    timeout: 20000
- tapOn: ◀ Levels
