# F2 (T155, rig plan wave 1): the plan's side lists on a fresh copy of the master. Conns rows name
# both ends (T95); a C-nn search lists that run and its two end devices, a device search that
# device only; a search for B1-S3 or its room finds its punch item #8 by the row's shown text (T163);
# B1's Punch list shows #8's Device text from its device and follows a Relocated
# room at once (T81); B2's Neuron ID item reads "Missing all Device Neuron
# IDs" with no list until a Neuron ID is typed, then "Missing some …" listing B2-D1 only (T34 upkeep,
# D170, T169); a rack's card asks for no Neuron ID (T68).
# The item editor (T162): a Punch row opens it, Tracking status Open → Closed stamps Date closed, an
# owner chip, a part Needed → Ordered; the rules' Neuron ID item is read-only and links B2-D1.
appId: productions.luminarytechnology.fieldsurvey
name: F2 — punch, parts and Conns lists
---
- runFlow: _launch.yaml
- runFlow: _connect.yaml
- runFlow: _seed-copy.yaml
- runFlow:
    file: _open-level.yaml
    env:
      LEVEL: 06M
- runFlow: _lists-conns.yaml
- runFlow: _lists-punch.yaml
