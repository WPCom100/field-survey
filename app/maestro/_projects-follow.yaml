# R7 (T157): the sidebar's project button → Projects → project CHIP (env) → its levels (HAS shown;
# HASNOT, unless "none", not), and Lint, Cable / riser, Dashboard, Rulings and Export follow it (T83).
# Starts and ends on the Levels home. (The home's project chips went with T176.)
appId: productions.luminarytechnology.fieldsurvey
---
- tapOn:
    id: nav.projects
- scrollUntilVisible:
    element:
      id: projects.open.${CHIP}
    direction: DOWN
    visibilityPercentage: 50   # the newest project is the last row, partly under the edge (T156)
    timeout: 30000
- tapOn:
    id: projects.open.${CHIP}
- extendedWaitUntil:
    visible:
      id: level.${HAS}
    timeout: 30000
- runFlow:
    when:
      true: ${HASNOT !== 'none'}
    commands:
      - assertNotVisible:
          id: level.${HASNOT}
- tapOn:
    id: nav.lint
- extendedWaitUntil:
    visible: 'Lint \(\d+ open · .*'
    timeout: 30000
- runFlow:                    # the level chips are the levels with findings
    when:
      true: ${HASNOT === 'none'}
    commands:
      - assertVisible:
          id: lint.level.${HAS}
- runFlow:
    when:
      true: ${HASNOT !== 'none'}
    commands:
      - assertVisible: 'Lint \(0 open · 0 dismissed\)'   # a new, empty project
      - assertNotVisible:
          id: lint.level.${HASNOT}
- tapOn:
    id: rail.levels
- tapOn:
    id: nav.cable-riser
- extendedWaitUntil:
    visible: 'Cable / riser \(\d+.*\)'
    timeout: 30000
- runFlow:
    when:
      true: ${HASNOT !== 'none'}
    commands:
      - assertNotVisible:
          id: cables.level.${HASNOT}
- tapOn:
    id: rail.levels
- tapOn:
    id: nav.dashboard
- extendedWaitUntil:
    visible:
      id: dash.level.${HAS}
    timeout: 30000
- runFlow:
    when:
      true: ${HASNOT !== 'none'}
    commands:
      - assertNotVisible:
          id: dash.level.${HASNOT}
- tapOn:
    id: rail.levels
- tapOn:
    id: nav.export
- extendedWaitUntil:
    visible: ${CHIP}
    timeout: 15000
- tapOn:
    id: rail.levels
- assertVisible:
    id: level.${HAS}
