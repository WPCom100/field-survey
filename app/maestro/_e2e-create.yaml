# T49 stage 1: Projects → New project PROJECT with B2, B1, 01–04, 06, 06M, 07 (one level per
# Return, as pipeline.yaml: the field keeps focus, so it is tapped once) → Create → the Levels home.
appId: productions.luminarytechnology.fieldsurvey
---
- tapOn:
    id: nav.projects
- tapOn:
    id: projects.new
- assertVisible: New project
- tapOn:
    id: newProject.name
- inputText: ${PROJECT}
- pressKey: Enter          # closes the Name keyboard: since T180's cards the Add level field sits under it
- waitForAnimationToEnd
- tapOn:
    id: newProject.levelCode
- inputText: B2
- pressKey: Enter
- inputText: B1
- pressKey: Enter
- inputText: '01'
- pressKey: Enter
- inputText: '02'
- pressKey: Enter
- inputText: '03'
- pressKey: Enter
- inputText: '04'
- pressKey: Enter
- inputText: '06'
- pressKey: Enter
- inputText: 06M
- pressKey: Enter
- inputText: '07'
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
# the iPad keyboard's own key closes it over Create; the "Levels" title the flow tapped before is
# scrolled off by nine 44-pt rows since T174 (T50)
- tapOn: Hide keyboard
- assertNotVisible: own group    # no numbering picker open
# T183: on the Simulator (a hardware keyboard attached) that key only minimises the keyboard: the
# code field keeps focus and the form keeps its keyboard inset until the NEXT touch, which drops the
# inset; the form jumps 76 pt under the finger and the press is cancelled. Tapped on Create, that
# touch was lost and the run waited out its 2 minutes on the form. The title, back on screen now,
# takes that touch (a plain label: it only ends the editing).
- tapOn:
    id: newProject.levels   # the rail's Levels button has the same label (T190)
- waitForAnimationToEnd:
    timeout: 5000
# 06M arrived sharing 06's numbering group and as a split of 06, as the Tower (D33): New project
# joins a <code>M to its <code> by default (T172, D263)
- scrollUntilVisible:
    element:
      id: newProject.share.06M
    direction: DOWN
- assertVisible:
    id: newProject.share.06M
    text: '06 ▾'
- assertVisible:
    id: newProject.split.06M
    text: '06 ▾'
# `rig.sh e2e --unjoined` (UNJOINED=yes): both cleared, so Review drafts must offer the riser's
# "06 or 06M?" by the codes alone (T172)
- runFlow:
    when:
      true: ${UNJOINED == 'yes'}
    commands:
      - tapOn:
          id: newProject.share.06M
      - tapOn:
          id: newProject.share.06M.none
      - tapOn:
          id: newProject.split.06M
      - tapOn:
          id: newProject.split.06M.none
      - assertVisible:
          id: newProject.share.06M
          text: 'own group ▾'
      - assertVisible:
          id: newProject.split.06M
          text: '— ▾'
- scrollUntilVisible:
    element:
      id: newProject.create
    direction: DOWN
- tapOn:
    id: newProject.create
- runFlow: _create-again.yaml
- extendedWaitUntil:
    visible:
      id: level.07
    timeout: 120000
- assertVisible:
    id: level.06M
- assertVisible:
    id: level.B2
