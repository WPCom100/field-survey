# The device card from the plan's Devices list: status Issue, a note, and a punch item through the
# quick action "Spot-check fixed" (the card has no hand-made punch item; T151). Status and the quick
# action commit at once; the note commits on blur (Return).
appId: productions.luminarytechnology.fieldsurvey
---
- tapOn:
    id: plan.tab.devices
- tapOn:
    id: 'plan\.device\.06M-.*'
    index: 0
- tapOn:
    id: card.status.Issue
- assertVisible: '✓ Issue'
- tapOn:
    id: card.notes
- inputText: Maestro note
- pressKey: Enter
- tapOn:
    id: card.section.quick
- tapOn:
    id: card.quick.E6
# the "What was found" field takes focus (autoFocus) and Apply sits below the fold on a long card
# (a sensor with its Neuron ID row and a finding line, T181): Return applies the open action
- runFlow: _quick-apply.yaml
- extendedWaitUntil:
    visible: 'Punch items 1.*'          # the section header: title and count (T175)
    timeout: 10000
