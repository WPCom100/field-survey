# S5 step 2 of `rig.sh sheets` (T158, T144, T130, T111), on A after sheets-old.yaml: a hand-made
# app-library type MAESTRO-CLASH-<n> (the upload carries a DaVinci type of that model: "1 model
# clash", the hand-made one untouched, then rejected); Sources → the
# DaVinci library with the CURRENT categories workbook (and a newer library.json, so the pair is
# not "Already imported") → "Done: … n categories corrected" and no Neuron flag counted. App
# library: ERn2-W-120 Mk2 under Equipment Panels; P-NSPS-D still reads Neuron ID Needed (a person's
# flag stands), set back to By the wires. Lint: "Category differs from its type (1)" for the ERn
# device → Fix all via ruling → Preview 1 → Apply → the check is gone. Sync.
appId: productions.luminarytechnology.fieldsurvey
name: Sheets — the current DaVinci categories correct the ERn type
---
- runFlow: _resume.yaml
- evalScript: ${output.n = PROJECT.replace(/\D/g, '')}
# T111: a hand-made app-library type whose model this upload's library also carries (rig.sh adds
# a DaVinci type MAESTRO-CLASH-<n>); synced before the upload, so the job finds it
- tapOn:
    id: nav.projects
- tapOn:
    id: projects.library
- tapOn:
    id: library.new
- tapOn:
    id: library.new.model
- inputText: MAESTRO-CLASH-${output.n}
- tapOn:
    id: library.new.add
- extendedWaitUntil:
    visible:
      id: library.note
      text: Added MAESTRO-CLASH-${output.n} as a draft.
    timeout: 10000
- tapOn: ◀ Projects
- scrollUntilVisible:          # the Projects screen has no sidebar: open PROJECT from its list
    element:
      id: projects.open.${PROJECT}
    direction: DOWN
    visibilityPercentage: 50
    timeout: 90000
- tapOn:
    id: projects.open.${PROJECT}
- extendedWaitUntil:
    visible:
      id: nav.needs-review
    timeout: 30000
- runFlow: _sync.yaml
- runFlow: _davinci.yaml
- assertVisible:
    id: sources.davinci.status
    text: 'Done: .*\d+ categor(y|ies) corrected.*, 1 model clash'
- assertNotVisible:
    id: sources.davinci.status
    text: '.*Neuron flags? corrected.*'
- tapOn:
    id: setup.home
- runFlow: _sync.yaml

# the app library: ERn2 under Equipment Panels; the hand-set flag stands
- tapOn:
    id: nav.projects
- tapOn:
    id: projects.library
# T111: the hand-made type is untouched (a draft with no DaVinci source line); rejected so it
# clashes with nothing later
- tapOn:
    id: library.search
- inputText: MAESTRO-CLASH-${output.n}
- pressKey: Enter
- tapOn:
    id: library.type
    text: '.*MAESTRO-CLASH-${output.n}.*'
- assertVisible: 0 devices · draft
- assertNotVisible: 'From .*\(library .*\)'   # a DaVinci type's source line
- assertNotVisible: Datasheet ↗
- tapOn:
    id: library.reject
- extendedWaitUntil:
    visible:
      id: library.note
      text: 'Rejected: .*'
    timeout: 10000
- tapOn:
    id: library.search
- eraseText: 30
- tapOn:                     # a tap lands mid-word and eraseText deletes only before the cursor
    id: library.search
- eraseText: 30
- inputText: ERn2-W-120
- pressKey: Enter          # closes the keyboard: it covers the Save footer
- assertVisible: '(▾ |▸ )?Equipment Panels.*'
- tapOn:
    id: library.type
    text: '.*ERn2-W-120 Mk2.*'
- assertVisible:
    id: library.category.Equipment Panels
    selected: true
- tapOn:
    id: library.search
- eraseText: 30
- tapOn:                     # a tap lands mid-word and eraseText deletes only before the cursor
    id: library.search
- eraseText: 30
- inputText: P-NSPS-D
- pressKey: Enter          # closes the keyboard: it covers the Save footer
- tapOn:
    id: library.type
    text: '.*P-NSPS-D.*'
    index: 0
- assertVisible:
    id: library.neuron.needed
    selected: true
- tapOn:
    id: library.neuron.wires
- tapOn:
    id: library.save
- extendedWaitUntil:
    visible:
      id: library.note
      text: Saved.
    timeout: 10000
- tapOn: ◀ Projects
- tapOn: ◀ Levels

# Lint: the ERn device's category differs from its type's → one ruling
- tapOn:
    id: nav.lint
- extendedWaitUntil:
    visible: 'Lint \(\d+ open · \d+ dismissed.*\)'
    timeout: 30000
- runFlow:
    when:
      visible: '▸ Category differs from its type \(1\)'
    commands:
      - tapOn: '▸ Category differs from its type \(1\)'
- assertVisible: '▾ Category differs from its type \(1\)'
- tapOn:
    id: lint.fixAll.Equipment
- extendedWaitUntil:
    visible:
      id: rulings.editor.title
      text: New ruling · from Lint
    timeout: 10000
- tapOn:
    id: rulings.preview
- extendedWaitUntil:
    visible:
      id: rulings.preview.title
      text: '1 change on 1 level'
    timeout: 15000
- assertVisible: '.*Equipment.*Equipment Panels.*'
- tapOn:
    id: rulings.apply
- extendedWaitUntil:
    visible:
      id: rulings.note
      text: 'Applied .*: 1 change\.'
    timeout: 15000
- tapOn: ← Levels
- tapOn:
    id: nav.lint
- extendedWaitUntil:
    visible: 'Lint \(\d+ open · \d+ dismissed.*\)'
    timeout: 30000
- assertNotVisible: '. Category differs from its type.*'
- tapOn: ← Levels
- runFlow: _sync.yaml
