# S4 (T158) library step 3 (T48; one library since T197, D287, D292 (6)): three cable-less types
# named for this run, made from the project's Library (the sidebar's), which is the app library.
# MAESTRO-R-<n>: Reject → `rejected` in the list, Back to draft → DRAFT (no device uses it, so no
# question). MAESTRO-D-<n>: Delete → the question ("No device on this iPad uses it …") → Delete →
# `deleted` in the list, read-only with Restore → Restore → DRAFT again. No Copy from… and no
# Promote any more. Then Projects → Device-type library: the same library (the same title, both
# types found, MAESTRO-R a draft with 0 devices). Both are deleted at the end (a delete with no
# device asks; Delete confirms), and so is the run's P-NSPS-D-KIT (its question names devices),
# so the server-wide library keeps nothing of the rig's but deleted rows. Starts and ends on Levels.
appId: productions.luminarytechnology.fieldsurvey
---
- evalScript: ${output.n = PROJECT.replace(/\D/g, '')}
- tapOn:
    id: nav.library
- assertVisible: 'Device-type library.*'
- assertNotVisible:
    id: library.copy
# reject and back
- tapOn:
    id: library.new
- tapOn:
    id: library.new.model
- inputText: MAESTRO-R-${output.n}
- tapOn:
    id: library.new.add
- extendedWaitUntil:
    visible:
      id: library.note
      text: Added MAESTRO-R-${output.n} as a draft.
    timeout: 10000
- assertNotVisible:
    id: library.promote
- tapOn:
    id: library.reject
- extendedWaitUntil:
    visible:
      id: library.note
      text: 'Rejected: .*'
    timeout: 10000
- assertVisible:
    id: library.type
    text: rejected MAESTRO-R-${output.n}.*
- tapOn:
    id: library.reopen
- extendedWaitUntil:
    visible:
      id: library.note
      text: Back to draft.
    timeout: 10000
- assertVisible:
    id: library.type
    text: DRAFT MAESTRO-R-${output.n}.*
# delete asks, then Restore brings it back
- tapOn:
    id: library.new
- tapOn:
    id: library.new.model
- inputText: MAESTRO-D-${output.n}
- tapOn:
    id: library.new.add
- extendedWaitUntil:
    visible:
      id: library.note
      text: Added MAESTRO-D-${output.n} as a draft.
    timeout: 10000
- tapOn:
    id: library.delete
- extendedWaitUntil:
    visible: 'Delete MAESTRO-D-${output.n}\?'
    timeout: 10000
- assertVisible: No device on this iPad uses it. Every project loses the type.
# the alert's Delete, not the footer's (the alert container spans its buttons, T151)
- tapOn:
    text: Delete
    rightOf: Cancel
- extendedWaitUntil:
    visible:
      id: library.note
      text: 'Deleted: MAESTRO-D-${output.n}.'
    timeout: 10000
- assertVisible:
    id: library.type
    text: deleted MAESTRO-D-${output.n}.*
- assertVisible:
    id: library.type.state
    text: 0 devices · deleted
- assertNotVisible:
    id: library.save
- tapOn:
    id: library.restore
- extendedWaitUntil:
    visible:
      id: library.note
      text: 'Restored: MAESTRO-D-${output.n}.'
    timeout: 10000
- assertVisible:
    id: library.type
    text: DRAFT MAESTRO-D-${output.n}.*
- tapOn:
    id: rail.levels

# Projects' Library: the same library
- tapOn:
    id: nav.projects
- tapOn:
    id: projects.library
- assertVisible: 'Device-type library.*'
- tapOn:
    id: library.search
- inputText: MAESTRO-R-${output.n}
- pressKey: Enter
- tapOn:
    id: library.type
    text: DRAFT MAESTRO-R-${output.n}.*
- assertVisible:
    id: library.type.state
    text: 0 devices · draft
# clean up: delete both (no device uses them: the question, then Delete)
- tapOn:
    id: library.delete
- extendedWaitUntil:
    visible: 'Delete MAESTRO-R-${output.n}\?'
    timeout: 10000
- tapOn:
    text: Delete
    rightOf: Cancel
- extendedWaitUntil:
    visible:
      id: library.note
      text: 'Deleted: MAESTRO-R-${output.n}.'
    timeout: 10000
- tapOn:
    id: library.search
- eraseText: 40
- tapOn:
    id: library.search
- eraseText: 40
- inputText: MAESTRO-D-${output.n}
- pressKey: Enter
- tapOn:
    id: library.type
    text: DRAFT MAESTRO-D-${output.n}.*
- tapOn:
    id: library.delete
- extendedWaitUntil:
    visible: 'Delete MAESTRO-D-${output.n}\?'
    timeout: 10000
- tapOn:
    text: Delete
    rightOf: Cancel
- extendedWaitUntil:
    visible:
      id: library.note
      text: 'Deleted: MAESTRO-D-${output.n}.'
    timeout: 10000
# the run's P-NSPS-D-KIT (`_library-type`, accepted by `_library-card`) leaves the server-wide
# library too, so the next run can make it again and other projects stop reading it; the seed
# copy's NSPS use it, so the question names the devices
- tapOn:
    id: library.search
- eraseText: 40
- tapOn:
    id: library.search
- eraseText: 40
- inputText: P-NSPS-D-KIT
- pressKey: Enter
- tapOn:
    id: library.type
    text: 'P-NSPS-D-KIT · .*'
- tapOn:
    id: library.delete
- extendedWaitUntil:
    visible: 'Delete P-NSPS-D-KIT\?'
    timeout: 10000
- assertVisible: '\d+ devices? on this iPad uses? it\. .*Lint flags.*'
- tapOn:
    text: Delete
    rightOf: Cancel
- extendedWaitUntil:
    visible:
      id: library.note
      text: 'Deleted: P-NSPS-D-KIT.'
    timeout: 10000
- tapOn:
    id: library.back
- scrollUntilVisible:
    element:
      id: projects.open.${PROJECT}
    direction: DOWN
    visibilityPercentage: 50
    timeout: 90000
- tapOn:
    id: projects.open.${PROJECT}
- extendedWaitUntil:
    visible:
      id: nav.needs-review
    timeout: 30000
