# F4: + Draft device MODEL, category CAT, QTY units on 06M (env) → Add draft → Accept.
appId: productions.luminarytechnology.fieldsurvey
---
- tapOn:
    id: drafts.tab.devices
- tapOn:
    id: drafts.addDevice
- tapOn:
    id: drafts.new.model
- inputText: ${MODEL}
- pressKey: Enter         # closes the keyboard: since T190 the bar puts Add draft under it
- tapOn:
    id: drafts.new.qty
- eraseText: 3
- inputText: ${QTY}
- pressKey: Enter         # T194: at the panel's 2/5 the category chips take more rows and Add draft sits under the keyboard
- tapOn:
    id: drafts.new.cat.${CAT}
- tapOn:
    id: drafts.new.level.06M
- tapOn:
    id: drafts.new.add
- extendedWaitUntil:
    visible:
      id: drafts.notice
      text: Draft added
    timeout: 10000
- tapOn:
    id: draft.accept
- extendedWaitUntil:
    visible:
      id: drafts.notice
      text: Accepted
    timeout: 10000
