# F2 on B1 and B2 (T81, T34, T68, T162): the Punch list's Device text, a Relocated that it follows at
# once, and the Neuron ID item's all / some wording and Notes (T169). Starts on Levels.
appId: productions.luminarytechnology.fieldsurvey
---
- tapOn:
    id: level.B1
- tapOn:
    id: plan.tab.punch
# T163: a device search finds its punch items by the row's device ID, and a room by its Device text
- runFlow:
    file: _search.yaml
    env:
      TERM: XXB1-C005
- assertVisible:
    id: plan.row.punch.8
    text: '.*Install cover.*B1-S3 · .*Corridor XXB1-C005, north.*'
- runFlow:
    file: _search.yaml
    env:
      TERM: B1-S3
- assertVisible:
    id: plan.row.punch.8
    text: '.*Install cover.*B1-S3 · .*Corridor XXB1-C005, north.*'
# a Punch row opens the item editor (T162); its device button opens the card
- tapOn:
    id: plan.row.punch.8
- extendedWaitUntil:
    visible:
      id: item.title
      text: '.*Install cover.*'
    timeout: 5000
- tapOn:
    id: item.device
- extendedWaitUntil:
    visible:
      id: card.close
    timeout: 5000
- assertVisible: B1-S3
- runFlow:
    file: _side-down.yaml
    env:
      ID: card.section.quick
- tapOn:
    id: card.section.quick
- tapOn:
    id: card.quick.E9
- tapOn:
    id: card.quick.input
- inputText: Corridor XXB1-C006
- runFlow: _quick-apply.yaml
- assertVisible: .*Corridor XXB1-C006; moved from Corridor XXB1-C005, north.*   # the card header
- tapOn:
    id: card.close
- extendedWaitUntil:
    visible:
      id: plan.row.punch.8
      text: '.*B1-S3 · .*Corridor XXB1-C006; moved from Corridor XXB1-C005, north.*'
    timeout: 10000
# T162: Tracking status Open → Closed stamps Date closed; an owner chip; ◀ back to the list
- tapOn:
    id: plan.row.punch.8
- extendedWaitUntil:
    visible:
      id: item.status.Open
      text: ✓ Open
    timeout: 5000
- tapOn:
    id: item.status.Closed
- extendedWaitUntil:
    visible:
      id: item.dateClosed
      text: 'Date closed \d{4}-\d\d-\d\d.*'
    timeout: 5000
- assertVisible:
    id: item.status.Closed
    text: ✓ Closed
- tapOn:
    id: item.owner.EC/ETC
- extendedWaitUntil:
    visible:
      id: item.owner.EC/ETC
      text: ✓ EC/ETC
    timeout: 5000
- tapOn:
    id: item.history
- assertVisible: '.*Tracking status.*'
- assertVisible: 'Open → Closed'
- tapOn:
    id: item.back
- extendedWaitUntil:
    visible:
      id: plan.row.punch.8
      text: '.*EC/ETC · Closed.*'
    timeout: 10000
# Parts: Needed → Ordered on the level's first part
- runFlow: _search-clear.yaml
- tapOn:
    id: plan.tab.parts
- tapOn:
    id: 'plan\.row\.parts\..*'
    index: 0
- extendedWaitUntil:
    visible:
      id: item.status.Needed
      text: ✓ Needed
    timeout: 5000
- tapOn:
    id: item.status.Ordered
- extendedWaitUntil:
    visible:
      id: item.status.Ordered
      text: ✓ Ordered
    timeout: 5000
- tapOn:
    id: item.back
- assertVisible: '.*· Ordered'
- tapOn:
    id: plan.back
# B2: "Missing all Device Neuron IDs" (#9): no device on B2 has its Neuron ID yet, so its Notes
# are the phrase "All devices on this floor" and the editor lists no device (T169, D258)
- tapOn:
    id: level.B2
- tapOn:
    id: plan.tab.punch
- runFlow:
    file: _search.yaml
    env:
      TERM: Neuron
- extendedWaitUntil:
    visible:
      id: plan.row.punch.9
      text: '.*Missing all Device Neuron IDs.*'
    timeout: 15000
- tapOn:
    id: plan.row.punch.9
- extendedWaitUntil:
    visible:
      id: item.missing.all
    timeout: 5000
- assertVisible: All devices on this floor
- assertNotVisible:
    id: item.missing.B2-D1
- tapOn:
    id: item.back
- runFlow: _search-clear.yaml
# a Neuron ID typed for B2-S1: B2 now reads "some" and lists only B2-D1 (T34 upkeep, D170, T169)
- tapOn:
    id: plan.tab.devices
- tapOn:
    id: plan.device.B2-S1
- runFlow:
    file: _side-down.yaml
    env:
      ID: card.neuron.type
- tapOn:
    id: card.neuron.type
- inputText: 00A1B2C3D4E5
- tapOn:
    id: card.neuron.save
- assertVisible: 00A1B2C3D4E5
- tapOn:
    id: card.close
- tapOn:
    id: plan.tab.punch
- runFlow:
    file: _search.yaml
    env:
      TERM: B2-D1
- extendedWaitUntil:
    visible:
      id: plan.row.punch.9
      text: '.*Missing some Device Neuron IDs.*'
    timeout: 15000
# T162: the rules keep this item; its status is read-only and B2-D1 is a link to its card
- tapOn:
    id: plan.row.punch.9
- extendedWaitUntil:
    visible:
      id: item.rule
    timeout: 5000
- assertVisible:
    id: item.status.Closed
    enabled: false
- assertVisible:
    id: item.missing.B2-D1
- assertNotVisible:
    id: item.missing.B2-S1
- tapOn:
    id: item.missing.B2-D1
- extendedWaitUntil:
    visible:
      id: card.close
    timeout: 5000
- assertVisible: B2-D1
- tapOn:
    id: card.close
- runFlow: _search-clear.yaml
# T68: a rack or NSPS hosts the Unison bus and is asked for no Neuron ID; the station is
- tapOn:
    id: plan.tab.devices
- tapOn:
    id: plan.device.B2-03
- extendedWaitUntil:
    visible:
      id: card.close
    timeout: 5000
- assertVisible: 'NSPS.*|.*P-NSPS-D.*'
- assertNotVisible:
    id: card.neuron.type
- assertNotVisible: Neuron ID
- tapOn:
    id: card.close
- tapOn:
    id: plan.back
