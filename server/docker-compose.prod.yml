# Production override for the Droplet (D67 option A). Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# (docs/ops.md sets COMPOSE_FILE in .env so plain `docker compose` picks both up.)
# Differences from dev: no local S3 (R2 from .env), Postgres not published, restarts, log caps.
x-prod: &prod
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

# GIT_SHA is exported by deploy/deploy.sh (D154); /health reports it. A hand-run build gets "dev".
x-build: &build
  context: .
  args:
    GIT_SHA: ${GIT_SHA:-dev}

services:
  api:
    <<: *prod
    build: *build
    depends_on: !reset [postgres]
  # A job that outgrows its cap is killed alone instead of starving the API (T124): the
  # container restarts and the batch fails on its second try (runner.recover_interrupted).
  # The largest sheet so far (Level 02, 14 MB) peaks near 600 MB.
  worker:
    <<: *prod
    build: *build
    depends_on: !reset [postgres]
    mem_limit: 2g
    memswap_limit: 2g
  postgres:
    <<: *prod
    ports: !reset []
  caddy:
    <<: *prod
  s3:
    profiles: [dev-only]
