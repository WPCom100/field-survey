# Override for the twin-client harness (T14) and the Mac rig (T149): the API reachable from the
# host on 8010 with a known token, local S3. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build postgres s3 api
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T api alembic upgrade head
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T api python -m app.storage ensure-bucket
# then, from the repo root:
#   FIELD_SURVEY_E2E_URL=http://127.0.0.1:8010 FIELD_SURVEY_E2E_TOKEN=e2e pnpm --filter @field-survey/core test:e2e
# The harness creates projects with `POST /projects` (T41) and restarts the API with
# `restart api` through the same two compose files (packages/core/docs/e2e.md).
# The worker gets the same environment: uploads (DaVinci, floor plans, seed import, BOM) are jobs
# it runs; `rig.sh server` starts it too (T151). Add `worker` to the `up` line above for those.
x-e2e-env: &e2e-env
  AUTH_MODE: token
  SURVEY_SHARED_TOKEN: e2e
  TEAM_NAMES_CSV: Ann,Bob
  S3_ENDPOINT: http://s3:9000
  S3_BUCKET: survey
  S3_ACCESS_KEY: dev
  S3_SECRET_KEY: dev
  BACKUP_ENABLED: "false"
services:
  api:
    ports: ["127.0.0.1:8010:8000"]
    environment: *e2e-env
  worker:
    environment: *e2e-env
