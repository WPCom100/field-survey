[project]
name = "field-survey-server"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]",
  "pydantic-settings",
  "boto3",
  "python-multipart",
  "openpyxl>=3.1.5",
  "xlsxwriter>=3.2.9",
  "pillow>=12.3.0",
  "weasyprint>=70.0",
  "pypdfium2>=5.14.0",
  "pdfplumber>=0.11.10",
  "pypdf>=6.20.1",
  "anthropic>=1.15.0",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
