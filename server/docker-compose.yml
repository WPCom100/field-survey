services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-survey}:${POSTGRES_PASSWORD:-survey}@postgres:5432/${POSTGRES_DB:-survey}
    depends_on: [postgres, s3]
    expose: ["8000"]
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-survey}:${POSTGRES_PASSWORD:-survey}@postgres:5432/${POSTGRES_DB:-survey}
    depends_on: [postgres, s3]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-survey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-survey}
      POSTGRES_DB: ${POSTGRES_DB:-survey}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  # Local S3 stand-in (dev only; R2 everywhere else). SeaweedFS replaced MinIO, whose images left
  # Docker Hub. No identities are configured, so any S3_ACCESS_KEY/S3_SECRET_KEY works. Create
  # the bucket once: `docker compose run --rm api python -m app.storage ensure-bucket`.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-master.volumeSizeLimitMB=64", "-volume.max=100"]
    ports: ["9000:9000"]
    volumes: [s3data:/data]
  caddy:
    image: caddy:2
    environment:
      SURVEY_HOSTNAME: ${SURVEY_HOSTNAME:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

volumes:
  pgdata:
  s3data:
  caddy_data:
