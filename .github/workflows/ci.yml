name: ci
on:
  push:
  pull_request:
  # Redeploy or roll back (docs/ops.md §2): runs the tests on that commit, then deploys it.
  # Never publishes an update; roll the JS back with `eas update:republish`.
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit sha on main to deploy
        required: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: survey
          POSTGRES_PASSWORD: survey
          POSTGRES_DB: survey
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
      # WeasyPrint's system libraries (floor PDF, T59)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: uv sync
      - run: uv run ruff check
      - run: uv run pytest

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - run: pnpm typecheck
      - run: pnpm lint

  # Twin-client harness (T14): two core stores against the real server in Docker
  # (packages/core/docs/e2e.md). Also runs the blob e2e test from T12.
  e2e:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f server/docker-compose.yml -f server/docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cp server/.env.example server/.env
      - run: $COMPOSE up -d --build postgres s3 api
      - name: Migrate and create the bucket
        run: |
          for i in $(seq 1 60); do $COMPOSE exec -T postgres pg_isready -U survey && break; sleep 1; done
          $COMPOSE exec -T api alembic upgrade head
          for i in $(seq 1 30); do $COMPOSE exec -T api python -m app.storage ensure-bucket && break; sleep 1; done
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @field-survey/core test:e2e
        env:
          FIELD_SURVEY_E2E_URL: http://127.0.0.1:8010
          FIELD_SURVEY_E2E_TOKEN: e2e
      - if: failure()
        run: $COMPOSE logs api

  # Delivery (D154, docs/ops.md §2): a green push to main deploys the server, then publishes the
  # JS update. One deploy at a time; a queued one waits, never cancels the running one.
  deploy:
    needs: [server, client, e2e]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      SHA: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: server/deploy
      - name: Deploy over ssh
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$DROPLET_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # The key is a forced command on the Droplet: the only thing it can send is the sha.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=server/deploy/known_hosts -o ServerAliveInterval=30 \
            "root@$DROPLET_HOST" "$SHA"
      - name: Public /health reports the commit
        run: |
          body=$(curl -fsS --max-time 10 https://survey.wpcom.cloud/health)
          echo "$body"
          [[ "$body" == *"\"commit\":\"$SHA\""* ]]

  update:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: update
      cancel-in-progress: false
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # D157: the manifest has no message, so it is baked into the bundle (--clear-cache, or
      # Metro reuses the previous one); --environment is required non-interactively.
      - name: Publish to the production channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          M="$(git log -1 --pretty=%s)"
          EXPO_PUBLIC_UPDATE_MESSAGE="$M" npx eas-cli@24.12.1 update --channel production --environment production \
            --platform ios --clear-cache --message "$M" --non-interactive
